name: Deploy

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    # Only after a passing run for a push (or merged PR) to master
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          payload=$(printf '{"ref":"refs/heads/master","sha":"%s"}' "$SHA")
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DEPLOY_WEBHOOK_SECRET" | awk '{print $NF}')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            --data "$payload"
